<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Frameo</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; media-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="style.css"></head>
<body class="light">
<div id="app">
  <header class="titlebar">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true"><path d="M4 9V6a2 2 0 0 1 2-2h3M15 4h3a2 2 0 0 1 2 2v3M20 15v3a2 2 0 0 1-2 2h-3M9 20H6a2 2 0 0 1-2-2v-3" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="3.2" style="fill:var(--accent)"/></svg>
    <span class="disp brand">Frameo</span><span class="grow"></span>
    <button class="ic nodrag" data-act="settings" aria-label="Settings"></button>
    <span class="wc nodrag"><button class="wcb" data-act="min" aria-label="Minimize"><svg viewBox="0 0 20 20" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 10h10"/></svg></button><button class="wcb" data-act="close" aria-label="Close"><svg viewBox="0 0 20 20" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button></span>
  </header>
  <div id="banners"></div>
  <main id="view"></main>
  <footer id="status"></footer>
</div>
<div id="preview" hidden></div>
<div id="compress" hidden></div>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body></html>
