<!doctype html>
<html><head><meta charset="utf-8"><title>Frameo text</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<style>html,body{margin:0;height:100%;overflow:hidden;background:transparent}

<body><textarea id="t" rows="1" spellcheck="false" aria-label="Annotation text"></textarea><div id="h">Enter places it · Shift+Enter new line · Esc cancels</div>

</body></html>
