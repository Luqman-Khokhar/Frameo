<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Frameo — Annotate</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="editor.css"></head>
<body class="light">
<div id="app">
  <header id="tb" role="toolbar" aria-label="Annotation tools">
    <div class="grpb" role="group" aria-label="Tools">
      <button class="ic" data-tool="pen" aria-label="Pen (1)" title="Pen (1)" aria-pressed="false"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16l1-4 8.5-8.5a1.4 1.4 0 0 1 2 0l1 1a1.4 1.4 0 0 1 0 2L8 15z"/></svg></button>
      <button class="ic" data-tool="line" aria-label="Line (2)" title="Line (2)" aria-pressed="false"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 15.5l11-11"/></svg></button>
      <button class="ic" data-tool="arrow" aria-label="Arrow (3)" title="Arrow (3)" aria-pressed="false"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 15.5l11-11M8.5 4.5h7v7"/></svg></button>
      <button class="ic" data-tool="rect" aria-label="Rectangle (4)" title="Rectangle (4)" aria-pressed="false"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5.5" width="12" height="9" rx="1"/></svg></button>
      <button class="ic" data-tool="ellipse" aria-label="Ellipse (5)" title="Ellipse (5)" aria-pressed="false"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="10" cy="10" rx="6.5" ry="5"/></svg></button>
      <button class="ic" data-tool="text" aria-label="Text (6)" title="Text (6)" aria-pressed="false"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5.5h10M10 5.5v9.5M8 15h4"/></svg></button>
      <button class="ic" data-tool="eraser" aria-label="Eraser (7)" title="Eraser (7)" aria-pressed="false"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 15.5h8M4.8 11.7l5.5-5.9a1.4 1.4 0 0 1 2 0l2.6 2.6a1.4 1.4 0 0 1 0 2L10.5 15.5H7.7z"/></svg></button>
    </div>
    <span class="sepv"></span>
    <div class="grpb" id="sw" role="group" aria-label="Color"></div>
    <label class="cpick ic" title="Custom color"><span class="sr">Custom color</span><input type="color" id="cc" value="#e5484d"></label>
    <span class="sepv"></span>
    <div class="grpb" role="group" aria-label="Stroke width">
      <button class="ic wd" aria-pressed="false" data-w="3" aria-label="Thin" title="Thin"><i style="--s:2px"></i></button>
      <button class="ic wd" aria-pressed="false" data-w="6" aria-label="Medium" title="Medium"><i style="--s:4px"></i></button>
      <button class="ic wd" aria-pressed="false" data-w="12" aria-label="Thick" title="Thick"><i style="--s:8px"></i></button>
    </div>
    <span class="sepv"></span>
    <div class="grpb">
      <button class="ic" id="undo" aria-label="Undo (Ctrl+Z)" title="Undo (Ctrl+Z)"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 5L4 8.5 7.5 12M4.5 8.5h7a4 4 0 0 1 0 8H9"/></svg></button>
      <button class="ic" id="redo" aria-label="Redo (Ctrl+Shift+Z)" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 5L16 8.5 12.5 12M15.5 8.5h-7a4 4 0 0 0 0 8H11"/></svg></button>
      <button class="ic dng" id="clear" aria-label="Clear all" title="Clear all (undo restores)"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 6h11M8 6V4.5h4V6M6 6l.6 9.5h6.8L14 6"/></svg></button>
    </div>
    <span class="grow"></span>
    <span id="msg" class="sub" role="status" aria-live="polite"></span>
    <button class="ghost" id="copy">Copy</button>
    <button class="solid" id="save">Save</button>
  </header>
  <main id="stage"><div id="wrap"><canvas id="cv"></canvas></div></main>
</div>
<script src="engine.js"></script>
<script src="editor.js"></script>
</body></html>
